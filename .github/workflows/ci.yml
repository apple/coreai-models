name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository == 'apple/coreai-models'
    runs-on: [self-hosted, macos, goldengate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Ensure uv
        run: |
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Run the ruff pinned in pyproject.toml's lint group (also used by pre-commit),
      # so CI doesn't change behaviour whenever a new ruff is released.
      - run: uv run --frozen --only-group lint ruff check python/src/ python/tests/ models/
      - run: uv run --frozen --only-group lint ruff format --check python/src/ python/tests/ models/

  swift-format:
    if: github.repository == 'apple/coreai-models'
    runs-on: [self-hosted, macos, goldengate]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: swift format lint --strict --recursive swift/Sources/ swift/Tests/

  swift-test:
    if: github.repository == 'apple/coreai-models'
    runs-on: [self-hosted, macos, goldengate]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: swift test --arch arm64 --no-parallel

  # Core AI on the runtime bundled with coreai-core.
  python-test:
    if: github.repository == 'apple/coreai-models'
    runs-on: [self-hosted, macos, goldengate]
    timeout-minutes: 60
    # torch.compile builds C++ guards with clang++; without an Xcode here it uses the
    # runner's Command Line Tools, whose linker cannot read the macOS 27 SDK stubs.
    env:
      DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
      USE_LOCAL_COREAI: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Ensure uv
        run: |
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run pytest python/tests/test_model_units -x -q

  # Core AI on the macOS framework, the default for wheel installs on macOS 27.
  python-test-Mac:
    if: github.repository == 'apple/coreai-models'
    runs-on: [self-hosted, macos, goldengate]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode-latest.app/Contents/Developer
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Ensure uv
        run: |
          command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run pytest python/tests/test_model_units -x -q
