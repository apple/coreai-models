# Phi-4-mini INT4 export recipe.
#
# Body weights are INT4 (per-block, group size 32). The embedding is excluded
# and kept FP16 because it is tied to lm_head. The MLP down projection is kept
# at INT8: its INT4 matmul is numerically fragile on some Apple GPU families and
# can produce degenerate generation, so promoting only that projection restores
# stable output at a small size and latency cost over uniform INT4.
quantization_config:
  execution_mode: eager
  global_config:
    op_state_spec:
      weight:
        dtype: int4
        qscheme: symmetric_with_clipping
        granularity:
          type: per_block
          block_size: 32
          axis: 1
    op_input_spec: null
    op_output_spec: null
  module_type_configs:
    coreai_models.primitives.macos.sdpa.SDPA: null
    coreai_models.primitives.macos.rope.RoPE: null
    coreai_models.primitives.macos.rms_norm.RMSNorm: null
    coreai_models.primitives.macos.rms_norm.RMSNormPlusOne: null
    torch.nn.modules.sparse.Embedding: null
  module_name_configs:
    '.*mlp\.down_proj':
      op_state_spec:
        weight:
          dtype: int8
          qscheme: symmetric_with_clipping
          granularity:
            type: per_block
            block_size: 32
            axis: 1
      op_input_spec: null
      op_output_spec: null
