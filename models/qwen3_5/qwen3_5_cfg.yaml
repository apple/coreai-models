quantization_config:
  execution_mode: eager

  # By default, 4-bit quantize all weights
  global_config: null

  module_type_configs:
    "torch.nn.modules.linear.Linear":
      op_state_spec:
        weight:
          dtype: uint4
          qscheme: asymmetric
          granularity:
            type: per_block
            block_size: 32
            axis: 1
          qformulation: minval

      op_input_spec: null
      op_output_spec: null

    "torch.nn.modules.sparse.Embedding":
      op_state_spec:
        weight:
          dtype: uint4
          qscheme: asymmetric
          granularity:
            type: per_block
            block_size: 32
            axis: 1
          qformulation: minval

      op_input_spec: null
      op_output_spec: null

    # SwitchLinear weight is 4-D [1, num_experts, out, in]; block_size must be a
    # matching 4-element list so quantization blocks are sliced along the input dim.
    "coreai_models.primitives.macos.switch.SwitchLinear":
      module_state_spec:
        weight:
          dtype: uint4
          qscheme: asymmetric
          granularity:
            type: per_block
            block_size: [1, 1, 1, 32]
          qformulation: minval
      op_input_spec: null
      op_output_spec: null

  # Leave MoE routing gates unquantized.
  module_name_configs:
    'model\.layers\.[0-9]+\.mlp\.(gate|shared_expert_gate)': null
