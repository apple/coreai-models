# Mixed 4-bit/8-bit palettization for SmolLM2-1.7B iOS.
#
# Sensitivity sweep + genetic search result: blocks 0, 1, 22, 23 are the most
# sensitive to 4-bit palettization. Promoting them to 8-bit recovers quality
# (PPL 13.41 vs 53.12 uniform 4-bit) while keeping 20/24 layers at the fast
# ANE 4-bit kernel path.
#
# Benchmark (M2 Max): 37 tok/s decode, 2259 tok/s prefill
# Quality: PPL 13.41 (better than uniform 6-bit at 13.63)
kmeans_palettization_config:
  global_config:
    op_state_spec:
      weight:
        n_bits: 4
        granularity:
          type: per_grouped_channel
          axis: 0
          group_size: 8
  module_type_configs:
    torch.nn.modules.sparse.Embedding: null
    coreai_models.primitives.ios.embedding.LoadEmbeddings: null
  module_name_configs:
    'extend\.model\.layers\.(0|1|22|23)\.(self_attn|mlp)\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)':
      op_state_spec:
        weight:
          n_bits: 8
          granularity:
            type: per_grouped_channel
            axis: 0
            group_size: 8
